version: 1

metadata:
  ota:
    minimum_version: "1.6.28"

project:
  name: dbmask
  description: Bounded SQLite contributor verification and disposable PostgreSQL backend pressure
  type: application

toolchains:
  python:
    version: "3.12"

env:
  vars:
    DBMASK_SOURCE_URL:
      secret: true
    DBMASK_TARGET_URL:
      secret: true

tasks:
  setup:
    description: Install dbmask's development and PostgreSQL test dependencies
    notes: |
      Installs the dependencies used by both the existing SQLite contributor suite and the
      disposable PostgreSQL pressure workflow. It does not provision or contact a database.
    category: setup
    command:
      exe: python
      args: ["-m", pip, install, "-e", ".[dev,postgres]"]
    requirements:
      toolchains: [python]
    effects:
      network: true
      network_kind: dependency_hydration
    safe_for_agent: true

  test:
    description: Run dbmask's repository-owned SQLite contributor suite
    notes: |
      This is the ordinary contributor verification path. It exercises the repository-owned
      SQLite suite only; it does not prove PostgreSQL, MySQL, release behavior, or production safety.
    category: test
    command:
      exe: python
      args: ["-m", pytest, "-q"]
    requirements:
      toolchains: [python]
    depends_on: [setup]
    safe_for_agent: true

  postgres:seed:
    description: Create isolated synthetic source and target PostgreSQL databases
    notes: |
      CI/operator-only. Recreates only the exact local disposable source and target database
      identities declared for this pressure lane, then loads synthetic fixture data.
    category: setup
    command:
      exe: python
      args: [".github/ota/postgres_fixture.py"]
    requirements:
      toolchains: [python]
      env: [DBMASK_SOURCE_URL, DBMASK_TARGET_URL]
    effects:
      network: true
      network_kind: integration_test
      external_state: [postgres]
    depends_on: [setup]

  postgres:scan:
    description: Scan only the disposable synthetic PostgreSQL target
    notes: |
      Reads the seeded synthetic target through dbmask's PostgreSQL path. This is not a scan of
      a production database and deliberately excludes the unrelated date-classification issue.
    category: verify
    command:
      exe: python
      args: ["-m", dbmask.cli, scan, "--config", ".github/ota/dbmask-postgres.yaml"]
    requirements:
      toolchains: [python]
      env: [DBMASK_SOURCE_URL, DBMASK_TARGET_URL]
    effects:
      network: true
      network_kind: integration_test
    depends_on: [postgres:seed]

  postgres:dry-run:
    description: Preview masking against the disposable PostgreSQL target without writes
    notes: |
      Produces dbmask's masking preview for the synthetic target. No PostgreSQL mutation is
      declared at this step; mutation is isolated to the following apply task.
    category: verify
    command:
      exe: python
      args: ["-m", dbmask.cli, mask, "--config", ".github/ota/dbmask-postgres.yaml"]
    requirements:
      toolchains: [python]
      env: [DBMASK_SOURCE_URL, DBMASK_TARGET_URL]
    effects:
      network: true
      network_kind: integration_test
    depends_on: [postgres:scan]

  postgres:apply:
    description: Apply masking only to the disposable synthetic PostgreSQL target
    notes: |
      CI/operator-only. Mutates only the exact disposable target created by postgres:seed; it
      must never be used against a production or operator-supplied database.
    category: test
    command:
      exe: python
      args: ["-m", dbmask.cli, mask, "--config", ".github/ota/dbmask-postgres.yaml", "--apply"]
    requirements:
      toolchains: [python]
      env: [DBMASK_SOURCE_URL, DBMASK_TARGET_URL]
    effects:
      network: true
      network_kind: integration_test
      external_state: [postgres]
    depends_on: [postgres:dry-run]

  postgres:validate:
    description: Strictly validate the masked synthetic PostgreSQL target against its source copy
    notes: |
      Compares the masked disposable target with its synthetic source under dbmask strict
      validation. Passing does not establish general PostgreSQL, MySQL, or production correctness.
    category: verify
    command:
      exe: python
      args: ["-m", dbmask.cli, validate, "--config", ".github/ota/dbmask-postgres.yaml", "--strict"]
    requirements:
      toolchains: [python]
      env: [DBMASK_SOURCE_URL, DBMASK_TARGET_URL]
    effects:
      network: true
      network_kind: integration_test
    depends_on: [postgres:apply]

  postgres:verify:
    description: Run the bounded disposable PostgreSQL backend proof
    notes: |
      Aggregates seed, scan, dry run, apply, and strict validation for one PostgreSQL 16.10
      synthetic lane. It is non-blocking pressure evidence, not repository-wide backend proof.
    category: verify
    aggregate:
      tasks: [postgres:validate]

workflows:
  default: contributor
  contributor:
    intent: ci_validation
    description: Run dbmask's existing SQLite contributor suite
    run:
      task: test
  postgres-pressure:
    intent: ci_validation
    description: Exercise scan, dry run, apply, and strict validation on disposable synthetic PostgreSQL data
    run:
      task: postgres:verify
    notes: |
      This workflow exercises only a disposable PostgreSQL service and synthetic data. It does not
      prove behavior for production databases, every PostgreSQL configuration, MySQL, other SQL
      engines, release publishing, or the unrelated date-classification edge case under active fix.

agent:
  posture: readiness_strict
  entrypoint: test
  default_task: test
  safe_tasks:
    - setup
    - test
  verify_after_changes:
    - test
  writable_paths:
    - .ota
    - .github/ota
    - .pytest_cache
    - src
    - tests
  protected_paths:
    - .github/workflows/ci.yml
    - pyproject.toml
  bootstrap:
    ota:
      note: Install the exact reviewed unreleased Ota revision only for this advisory pressure lane.
      source:
        kind: git_rev
        rev: 21077abf9d861e664f98bd8c460772be3930eec1
  notes: |
    Use `ota tasks --safe --use` before selecting agent work. The PostgreSQL pressure workflow is
    CI/operator-only because it recreates disposable external databases; it is non-blocking and
    keeps dbmask's existing SQLite CI unchanged. Its synthetic fixture deliberately has no date
    column, so it does not exercise or classify the repository's separate date-detection issue.
